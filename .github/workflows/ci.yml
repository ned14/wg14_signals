name: CI

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '0 0 1 * *'

jobs:
  Linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        debug: [Debug, Release]
        standard: [11, 23]
        shared: [OFF, ON]
    env:
      NAME: Linux-${{ matrix.compiler }}-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}
      CC: ${{ matrix.compiler }}
          
    steps:
    - uses: actions/checkout@v4

    - name: Configure Linux
      shell: bash
      run: |
        mkdir build && cd build
        export CXX=${CC/cc/}++
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }}  -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Build Linux
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests Linux
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark
      
  MacOS:
    name: Mac OS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 23]
        shared: [OFF, ON]
    env:
      NAME: MacOS-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}
          
    steps:
    - uses: actions/checkout@v4

    - name: Configure Mac OS
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Build Mac OS
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests Mac OS
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark
      
  Windows:
    name: Windows VS2022
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 17]
        shared: [OFF, ON]
    env:
      NAME: Windows-${{ matrix.debug }}-${{ matrix.standard }}-${{ matrix.shared }}
          
    steps:
    - uses: actions/checkout@v4

    - name: Configure WinVS2022
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_C_FLAGS=/fsanitize:address

    - name: Build WinVS2022
      shell: bash
      run: cd build && cmake --build . --config ${{ matrix.debug }} --parallel

    - name: CMake tests WinVS2022
      shell: bash
      run: cd build && ctest -C ${{ matrix.debug }} --output-on-failure --timeout 300 -E benchmark

  HeaderOnly:
    name: Header-only (${{ matrix.os }}, C${{ matrix.standard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          standard: 11
        - os: ubuntu-latest
          standard: 23
        - os: macos-latest
          standard: 11
        - os: macos-latest
          standard: 23
        - os: windows-latest
          standard: 11
        - os: windows-latest
          standard: 17
    env:
      NAME: HeaderOnly-${{ matrix.os }}-C${{ matrix.standard }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DHEADER_ONLY_BUILD=ON -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DHEADER_ONLY_BUILD=ON -DCMAKE_C_FLAGS=/fsanitize:address

    - name: Build (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: cd build && cmake --build . --config Debug --parallel

    - name: CMake tests (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark

    - name: CMake tests (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: cd build && ctest -C Debug --output-on-failure --timeout 300 -E benchmark

  TSan:
    name: TSan (${{ matrix.os }}, ${{ matrix.compiler }}, C${{ matrix.standard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          compiler: gcc
          standard: 11
        - os: ubuntu-latest
          compiler: gcc
          standard: 23
        - os: ubuntu-latest
          compiler: clang
          standard: 11
        - os: ubuntu-latest
          compiler: clang
          standard: 23
        - os: macos-latest
          compiler: clang
          standard: 11
        - os: macos-latest
          compiler: clang
          standard: 23
    env:
      CC: ${{ matrix.compiler }}
      # TSan reports races but continues by default; halt on the first report
      # so a data race fails the test (and therefore the job). Keep the report
      # on stderr so ctest --output-on-failure shows it, force symbolization of
      # the stack traces, and grow per-thread history to the maximum so every
      # race report includes the full stack trace of each participating thread.
      TSAN_OPTIONS: halt_on_error=1 log_path=stderr symbolize=1 history_size=7
    steps:
    - uses: actions/checkout@v4

    # Ubuntu 24.04 runners use a high ASLR entropy (mmap_rnd_bits=32) which
    # makes TSan abort at startup with "unexpected memory mapping"; lowering it
    # to 28 is the standard workaround. Ignore failures in case the knob is
    # unavailable. macOS is unaffected.
    - name: Allow TSan to start (lower ASLR entropy, Linux only)
      if: runner.os == 'Linux'
      run: sudo sysctl vm.mmap_rnd_bits=28 || true

    - name: Configure TSan
      shell: bash
      run: |
        mkdir build && cd build
        export CXX=${CC/cc/}++
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=${{ matrix.standard }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/tsan-toolchain.cmake

    - name: Build TSan
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests TSan
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark

  FreeBSD:
    name: FreeBSD (C${{ matrix.standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        standard: [11, 23]
    env:
      NAME: FreeBSD-C${{ matrix.standard }}
    steps:
    - uses: actions/checkout@v4

    # Real FreeBSD kernel under QEMU on the standard Ubuntu runner (github's
    # own runners are Ubuntu/macOS/Windows only). The workspace is synced into
    # the VM and the prepare/run scripts execute inside it as root. clang ships
    # in the FreeBSD base system (with ASan/UBSan runtimes), so only cmake and
    # ninja are installed; cache-after-prepare reuses the prepared image on
    # later runs so pkg install runs once. release "15" tracks the newest 15.x
    # point release. This leg compiles the FreeBSD-only pthread_getthreadid_np
    # branch of current_thread_id.c.ipp and the libstdthreads C11-threads link
    # (plans/ideas.md 3.2, 2.4). The fallback hash-table TLS path is still
    # exercised only by the macOS legs (analysis.md 5.4).
    - name: FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        envs: 'NAME'
        usesh: true
        cache-after-prepare: true
        prepare: |
          pkg install -y cmake ninja
        run: |
          set -e
          mkdir build && cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_STANDARD=${{ matrix.standard }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake
          cmake --build . --parallel
          ctest --output-on-failure --timeout 300 -E benchmark
