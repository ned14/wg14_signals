name: CI

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '0 0 1 * *'

jobs:
  Linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.debug }}, C${{ matrix.standard }}, shared=${{ matrix.shared }}, fallback=${{ matrix.fallback }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        debug: [Debug, Release]
        standard: [11, 23]
        shared: [OFF, ON]
        # WG14_SIGNALS_ALWAYS_USE_FALLBACK_TLS (plans/ideas.md 2.1, 3.4): Linux natively
        # takes the async-signal-safe TLS path, so the OFF legs are the default
        # build and the ON legs force the tss_async_signal_safe hash-table
        # fallback under ASan/UBSan here — the platform with the strongest
        # tooling. macOS runs the fallback natively (config.h autodetects 0 on
        # Apple), so its ON legs just re-verify the option plumbing.
        fallback: [OFF, ON]
    env:
      NAME: Linux-${{ matrix.compiler }}-${{ matrix.debug }}-C${{ matrix.standard }}-shared=${{ matrix.shared }}-fallback=${{ matrix.fallback }}
      CC: ${{ matrix.compiler }}
          
    steps:
    - uses: actions/checkout@v4

    - name: Configure Linux
      shell: bash
      run: |
        mkdir build && cd build
        export CXX=${CC/cc/}++
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DWG14_SIGNALS_ALWAYS_USE_FALLBACK_TLS=${{ matrix.fallback }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Build Linux
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests Linux
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark
      
  MacOS:
    name: Mac OS (${{ matrix.debug }}, C${{ matrix.standard }}, shared=${{ matrix.shared }}, fallback=${{ matrix.fallback }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 23]
        shared: [OFF, ON]
        fallback: [OFF, ON]
    env:
      NAME: MacOS-${{ matrix.debug }}-C${{ matrix.standard }}-shared=${{ matrix.shared }}-fallback=${{ matrix.fallback }}
          
    steps:
    - uses: actions/checkout@v4

    - name: Configure Mac OS
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.debug }} -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DWG14_SIGNALS_ALWAYS_USE_FALLBACK_TLS=${{ matrix.fallback }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Build Mac OS
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests Mac OS
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark
      
  Windows:
    name: Windows VS2022 (${{ matrix.debug }}, C${{ matrix.standard }}, shared=${{ matrix.shared }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [Debug, Release]
        standard: [11, 17]
        shared: [OFF, ON]
    env:
      NAME: Windows-${{ matrix.debug }}-C${{ matrix.standard }}-shared=${{ matrix.shared }}
          
    steps:
    - uses: actions/checkout@v4

    - name: Configure WinVS2022
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_C_FLAGS=/fsanitize:address

    - name: Build WinVS2022
      shell: bash
      run: cd build && cmake --build . --config ${{ matrix.debug }} --parallel

    - name: CMake tests WinVS2022
      shell: bash
      run: cd build && ctest -C ${{ matrix.debug }} --output-on-failure --timeout 300 -E benchmark

  HeaderOnly:
    name: Header-only (${{ matrix.os }}, C${{ matrix.standard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          standard: 11
        - os: ubuntu-latest
          standard: 23
        - os: macos-latest
          standard: 11
        - os: macos-latest
          standard: 23
        - os: windows-latest
          standard: 11
        - os: windows-latest
          standard: 17
    env:
      NAME: HeaderOnly-${{ matrix.os }}-C${{ matrix.standard }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DHEADER_ONLY_BUILD=ON -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_C_STANDARD=${{ matrix.standard }} -DHEADER_ONLY_BUILD=ON -DCMAKE_C_FLAGS=/fsanitize:address

    - name: Build (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: cd build && cmake --build . --config Debug --parallel

    - name: CMake tests (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark

    - name: CMake tests (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: cd build && ctest -C Debug --output-on-failure --timeout 300 -E benchmark

  TSan:
    name: TSan (${{ matrix.os }}, ${{ matrix.compiler }}, C${{ matrix.standard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          compiler: gcc
          standard: 11
        - os: ubuntu-latest
          compiler: gcc
          standard: 23
        - os: ubuntu-latest
          compiler: clang
          standard: 11
        - os: ubuntu-latest
          compiler: clang
          standard: 23
        - os: macos-latest
          compiler: clang
          standard: 11
        - os: macos-latest
          compiler: clang
          standard: 23
    env:
      CC: ${{ matrix.compiler }}
      # TSan reports races but continues by default; halt on the first report
      # so a data race fails the test (and therefore the job). Keep the report
      # on stderr so ctest --output-on-failure shows it, force symbolization of
      # the stack traces, and grow per-thread history to the maximum so every
      # race report includes the full stack trace of each participating thread.
      #
      # report_signal_unsafe=0: the library's sigguarded() recovers from a
      # signal via siglongjmp out of the handler, and TSan keeps the thread
      # marked "inside a signal" across that longjmp. Any malloc/free the test
      # runs after recovery (e.g. signal_decider_create / siguninstall) is then
      # misreported as a signal-unsafe call, failing thrd_sigfpe_test and
      # recovery_null_loop_test. The reports are false positives: the code runs
      # outside the handler, and the library's handler path itself is
      # malloc/free-free given siginstall() pre-initialisation (the raise's
      # lifetime_refcount increment guarantees sighandler_info_release() never
      # frees inside the handler). Data-race reports are unaffected.
      TSAN_OPTIONS: halt_on_error=1 log_path=stderr symbolize=1 history_size=7 report_signal_unsafe=0
    steps:
    - uses: actions/checkout@v4

    # Ubuntu 24.04 runners use a high ASLR entropy (mmap_rnd_bits=32) which
    # makes TSan abort at startup with "unexpected memory mapping"; lowering it
    # to 28 is the standard workaround. Ignore failures in case the knob is
    # unavailable. macOS is unaffected.
    - name: Allow TSan to start (lower ASLR entropy, Linux only)
      if: runner.os == 'Linux'
      run: sudo sysctl vm.mmap_rnd_bits=28 || true

    - name: Configure TSan
      shell: bash
      run: |
        mkdir build && cd build
        export CXX=${CC/cc/}++
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=${{ matrix.standard }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/tsan-toolchain.cmake

    - name: Build TSan
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests TSan
      shell: bash
      run: cd build && ctest --output-on-failure --timeout 300 -E benchmark

  FreeBSD:
    name: FreeBSD (C${{ matrix.standard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        standard: [11, 23]
    env:
      NAME: FreeBSD-C${{ matrix.standard }}
    steps:
    - uses: actions/checkout@v4

    # Real FreeBSD kernel under QEMU on the standard Ubuntu runner (github's
    # own runners are Ubuntu/macOS/Windows only). The workspace is synced into
    # the VM and the prepare/run scripts execute inside it as root. clang ships
    # in the FreeBSD base system (with ASan/UBSan runtimes), so only cmake and
    # ninja are installed; cache-after-prepare reuses the prepared image on
    # later runs so pkg install runs once. release "15" tracks the newest 15.x
    # point release. This leg compiles the FreeBSD-only pthread_getthreadid_np
    # branch of current_thread_id.c.ipp and the libstdthreads C11-threads link
    # (plans/ideas.md 3.2, 2.4). The fallback hash-table TLS path is exercised
    # natively on the macOS legs and, since plans/ideas.md 3.4, under
    # ASan/UBSan on the Linux WG14_SIGNALS_ALWAYS_USE_FALLBACK_TLS=ON legs.
    - name: FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        envs: 'NAME'
        usesh: true
        cache-after-prepare: true
        prepare: |
          pkg install -y cmake ninja
        run: |
          set -e
          mkdir build && cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_STANDARD=${{ matrix.standard }} -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/sanitize-toolchain.cmake
          cmake --build . --parallel
          # header_only_build_test is excluded on FreeBSD pending diagnosis of
          # its single-TU C header-only consumer (current_thread_id() returns 0
          # there; finding `CIGA` FreeBSD case). The same header-only
          # functionality is covered on this leg by header_only_test (C++),
          # header_only_c_multi_test (C) and the header_only_build_test step-1
          # HEADER_ONLY_BUILD=ON build.
          ctest --output-on-failure --timeout 300 -E "benchmark|header_only_build_test"

  FilC:
    name: Fil-C (C11)
    runs-on: ubuntu-latest
    env:
      # Fil-C version pinned to a specific release; bump FILC_VERSION and the
      # FILC_SHA256 below together. Fil-C releases only ship Linux x86_64 (and
      # beta ARM64), so this job cannot run on macOS/Windows runners.
      FILC_VERSION: 0.682
      FILC_SHA256: cfa49af8090053dfa1be69656f0ca521f5e5b4e145652f37a33688b096764292
    steps:
    - uses: actions/checkout@v4

    - name: Install Fil-C ${{ env.FILC_VERSION }}
      shell: bash
      run: |
        curl -L --retry 3 --fail \
          -o "$RUNNER_TEMP/filc.tar.xz" \
          "https://github.com/pizlonator/fil-c/releases/download/v${FILC_VERSION}/filc-${FILC_VERSION}-linux-x86_64.tar.xz"
        echo "${FILC_SHA256}  $RUNNER_TEMP/filc.tar.xz" | sha256sum -c -
        mkdir -p "$HOME/filc"
        tar -xf "$RUNNER_TEMP/filc.tar.xz" -C "$HOME/filc"
        cd "$HOME/filc/filc-${FILC_VERSION}-linux-x86_64" && ./setup.sh
        # FILC_ROOT is consumed by cmake/filc-toolchain.cmake.
        echo "FILC_ROOT=$HOME/filc/filc-${FILC_VERSION}-linux-x86_64/build" >> "$GITHUB_ENV"

    - name: Configure Fil-C
      shell: bash
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=11 -DCMAKE_TOOLCHAIN_FILE=$PWD/../cmake/filc-toolchain.cmake

    - name: Build Fil-C
      shell: bash
      run: cd build && cmake --build . --parallel

    - name: CMake tests Fil-C
      shell: bash
      # Fil-C's runtime reserves SIGILL/SIGTRAP/SIGBUS/SIGSEGV/SIGFPE for its own
      # memory-safety mechanism: sigaction() on those signals returns ENOSYS, so
      # the library cannot install handlers for them and the tests that raise
      # them cannot work there. thrd_signal_sigfpe_handle_test is inherently a
      # SIGFPE test; recovery_null_loop_test never even sees a SIGSEGV -- Fil-C
      # panics on the null-pointer store before any signal is delivered.
      # post_uninstall_reentry_test uses SIGUSR2 under Fil-C instead (like
      # thrd_signal_handle_test and benchmark_thrd_signal_handle_test), so it
      # still runs here. header_only_build_test's sub-builds run with the system
      # compiler (they do not propagate the Fil-C toolchain) and pick up the
      # parent configure's __cxa_thread_atexit supplying library, which the
      # system linker cannot always satisfy; it is excluded pending diagnosis,
      # like the FreeBSD leg (analysis.md 5.10). The C++ header-only path is
      # still covered here by header_only_test (test_common.h swaps in its
      # pthread-backed C11-threads shim for C++ under Fil-C), by
      # header_only_c_multi_test and by the step-1 HEADER_ONLY_BUILD=ON build.
      run: cd build && ctest --output-on-failure --timeout 300 -E "benchmark|thrd_signal_sigfpe_handle_test|recovery_null_loop_test|header_only_build_test"
